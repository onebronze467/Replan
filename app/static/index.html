<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="여행 중 날씨·혼잡·동선 변화에 대응하는 실시간 여행 재설계 서비스">
  <title>RePlan — 실시간 여행 재설계</title>
  <style>
    :root{--blue:#2457d6;--navy:#12213f;--ink:#172033;--muted:#68738a;--bg:#f5f7fb;--line:#e5e9f2;--green:#168a63;--orange:#c7681c;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eef3ff,#f9fbff);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}button,input{font:inherit}button:focus-visible,input:focus-visible{outline:3px solid #91afff;outline-offset:2px}#app{width:min(1120px,100%);margin:auto;min-height:100vh;background:#fff;box-shadow:0 12px 50px #172b4d18}header{padding:22px 28px;background:linear-gradient(120deg,var(--navy),#2457d6);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:16px}h1{margin:0;font-size:24px}header p{margin:5px 0 0;color:#dce7ff;font-size:13px}.status{padding:8px 12px;border-radius:99px;background:#ffffff1c;font-size:12px;white-space:nowrap}.status.ok{background:#dff7ec;color:#11684d}.status.bad{background:#fff0ed;color:var(--red)}main{display:grid;grid-template-columns:330px 1fr;gap:20px;padding:20px;background:var(--bg)}.panel,.chatbox{background:#fff;border:1px solid var(--line);border-radius:18px}.panel{padding:18px;height:max-content}.panel h2{font-size:16px;margin:0 0 16px}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:#49556c}.field input{width:100%;padding:11px;border:1px solid #d7deeb;border-radius:10px;font-size:14px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #d7deeb;background:#fff;border-radius:99px;padding:7px 10px;color:#526078;cursor:pointer;font-size:12px}.chip.on{background:#eaf0ff;border-color:#6f91ed;color:#204ab7;font-weight:700}.primary,.secondary{width:100%;border:0;border-radius:11px;padding:12px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{margin-top:8px;background:#eaf0ff;color:#204ab7}.secondary:disabled{cursor:not-allowed;opacity:.55}.notice{margin-top:12px;padding:10px 12px;background:#f3f6ff;border-radius:10px;color:#53607a;font-size:11px;line-height:1.5}.selection{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}.selection strong{font-size:13px}.selection-list{margin:8px 0 0;padding-left:20px;color:#53607a;font-size:12px;line-height:1.6}.chatbox{min-height:680px;display:flex;flex-direction:column;overflow:hidden}.chathead{padding:15px 18px;border-bottom:1px solid var(--line);font-weight:800}.chathead small{display:block;color:var(--muted);font-weight:400;font-size:11px;margin-top:3px}.chat{flex:1;padding:18px;overflow:auto;background:#fbfcff}.msg{max-width:84%;padding:11px 13px;border-radius:14px;margin:8px 0;line-height:1.55;font-size:14px;white-space:pre-wrap}.bot{background:#fff;border:1px solid var(--line)}.user{margin-left:auto;background:var(--blue);color:#fff}.quick{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);overflow:auto}.quick button{white-space:nowrap;border:1px solid #cbd7f5;background:#f7f9ff;border-radius:99px;padding:8px 11px;color:#3157bb;cursor:pointer;font-size:12px}.inputbar{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}.inputbar input{flex:1;border:1px solid #d7deeb;border-radius:99px;padding:12px 15px;font-size:14px}.inputbar button{border:0;border-radius:99px;background:var(--blue);color:#fff;padding:0 18px;font-weight:700}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:10px 0 12px}.card{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#fff;box-shadow:0 3px 12px #2038640b}.card img,.image-placeholder{width:100%;height:105px;object-fit:cover;background:#e5ebf6}.cardbody{padding:10px}.cardtitle{font-weight:800;font-size:13px}.cardaddr{color:var(--muted);font-size:11px;margin-top:3px;min-height:30px}.badge{display:inline-block;margin-top:7px;border-radius:99px;padding:4px 7px;background:#e9f8f1;color:var(--green);font-size:10px;font-weight:700}.badge.high{background:#fff0e7;color:var(--orange)}.card-action{margin:0 10px 10px;padding:7px 9px;border:1px solid #cad5ef;border-radius:8px;background:#fff;color:#3157bb;cursor:pointer;font-size:11px}.card-action.selected{background:#eaf0ff;font-weight:800}.empty{padding:18px;background:#fff7ed;border-radius:12px;color:#875222;font-size:13px}.schedule{margin:12px 0;padding:12px;border:1px solid #dce5fb;border-radius:12px;background:#f7f9ff}.schedule h3{margin:0 0 8px;font-size:14px}.schedule p{margin:5px 0;font-size:12px}.footer{padding:12px 20px;color:#8a94a8;font-size:11px;text-align:center;border-top:1px solid var(--line)}@media(max-width:760px){main{display:block;padding:10px}.panel{margin-bottom:10px}.chatbox{min-height:690px}header{padding:18px}.status{font-size:0}.status::before{content:"API";font-size:11px}}
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div><h1>RePlan 🧭</h1><p>여행 중 변수가 생기면, 지금 상황에 맞게 다시 계획해요.</p></div>
      <div class="status" id="apiStatus" role="status">API 확인 중</div>
    </header>
    <main>
      <aside class="panel">
        <h2>여행 조건</h2>
        <div class="field"><label for="region">현재 여행 지역</label><input id="region" value="서울 종로구" list="regions" autocomplete="off"><datalist id="regions"><option value="서울 종로구"><option value="서울 강남구"><option value="부산 해운대"><option value="강릉"><option value="경주"><option value="전주"><option value="여수"><option value="제주 서귀포"></datalist></div>
        <div class="field"><label for="date">여행 날짜</label><input id="date" type="date"></div>
        <div class="field"><label>여행 스타일</label><div class="chips" id="styles"><button class="chip on" type="button">문화·역사</button><button class="chip" type="button">카페·휴식</button><button class="chip" type="button">자연·산책</button><button class="chip" type="button">맛집</button></div></div>
        <button class="primary" id="startTrip" type="button">이 조건으로 여행 시작하기</button>
        <div class="selection"><strong id="selectionCount">담은 장소 0개</strong><ol class="selection-list" id="selectionList"><li>추천 카드에서 장소를 담아보세요.</li></ol><button class="secondary" id="buildSchedule" type="button" disabled>선택 장소로 일정 만들기</button></div>
        <div class="notice">지역·날짜·스타일이 추천에 반영됩니다. 혼잡도는 요일·시간대·거리 기반 예상치이며 실측값이 아닙니다.</div>
      </aside>
      <section class="chatbox">
        <div class="chathead">실시간 여행 상담 <small>혼잡·비·동선 변경을 말해보세요.</small></div>
        <div class="chat" id="chat" aria-live="polite"></div>
        <div class="quick"><button type="button" data-message="주변 관광지 추천해줘">📍 주변 추천</button><button type="button" data-message="지금 너무 혼잡해요">😵 혼잡해요</button><button type="button" data-message="비가 오기 시작했어요">☔ 비가 와요</button><button type="button" id="redesignSchedule">🔄 일정 재설계</button></div>
        <div class="inputbar"><input id="inp" placeholder="예: 경복궁이 너무 붐벼요" aria-label="여행 상황 입력"><button id="sendButton" type="button">전송</button></div>
      </section>
    </main>
    <div class="footer">한국관광공사 TourAPI와 Open-Meteo를 활용한 RePlan 프로토타입</div>
  </div>
  <script>
    const API=(window.REPLAN_API||'').replace(/\/$/,'');
    let pos={lat:37.5665,lng:126.9780};
    let lastCards=[];
    const selectedCards=new Map();
    const chat=document.getElementById('chat');
    const inp=document.getElementById('inp');
    const apiStatus=document.getElementById('apiStatus');

    function localDate(){const now=new Date();const offset=now.getTimezoneOffset()*60000;return new Date(now-offset).toISOString().slice(0,10)}
    function tripContext(){return{region:document.getElementById('region').value.trim(),travel_date:document.getElementById('date').value||null,style:document.querySelector('.chip.on')?.textContent||'문화·역사'}}
    function cardKey(card){return String(card.contentid||`${card.title}|${card.addr}`)}
    function bubble(who,text){const el=document.createElement('div');el.className='msg '+who;el.textContent=text;chat.appendChild(el);chat.scrollTop=chat.scrollHeight;return el}
    function updateSelection(){const items=[...selectedCards.values()];document.getElementById('selectionCount').textContent=`담은 장소 ${items.length}개`;const list=document.getElementById('selectionList');list.replaceChildren();if(!items.length){const li=document.createElement('li');li.textContent='추천 카드에서 장소를 담아보세요.';list.appendChild(li)}else{items.forEach(item=>{const li=document.createElement('li');li.textContent=item.title;list.appendChild(li)})}document.getElementById('buildSchedule').disabled=!items.length}
    function toggleCard(card,button){const key=cardKey(card);if(selectedCards.has(key)){selectedCards.delete(key);button.textContent='일정에 담기';button.classList.remove('selected')}else{selectedCards.set(key,card);button.textContent='담기 취소';button.classList.add('selected')}updateSelection()}
    function renderCards(items){lastCards=items||[];const wrap=document.createElement('div');wrap.className='cards';if(!lastCards.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='추천 결과가 없습니다. 지역이나 검색 조건을 바꿔 다시 시도해 주세요.';wrap.appendChild(empty)}lastCards.forEach(card=>{const article=document.createElement('article');article.className='card';if(card.img){const img=document.createElement('img');img.src=card.img;img.alt=`${card.title||'추천 장소'} 사진`;img.loading='lazy';article.appendChild(img)}else{const placeholder=document.createElement('div');placeholder.className='image-placeholder';article.appendChild(placeholder)}const body=document.createElement('div');body.className='cardbody';const title=document.createElement('div');title.className='cardtitle';title.textContent=card.title||'추천 관광지';const addr=document.createElement('div');addr.className='cardaddr';addr.textContent=`${card.addr||'주소 정보 없음'}${card.dist?` · 약 ${Math.round(card.dist)}m`:''}`;const congestion=Number(card.congestion??50);const badge=document.createElement('span');badge.className='badge '+(congestion>=60?'high':'');badge.textContent=`예상 혼잡도 ${Math.round(congestion)}% · ${congestion>=60?'혼잡':'비교적 여유'}`;body.append(title,addr,badge);const action=document.createElement('button');action.type='button';action.className='card-action';if(selectedCards.has(cardKey(card))){action.textContent='담기 취소';action.classList.add('selected')}else{action.textContent='일정에 담기'}action.addEventListener('click',()=>toggleCard(card,action));article.append(body,action);wrap.appendChild(article)});chat.appendChild(wrap);chat.scrollTop=chat.scrollHeight}
    function renderSchedule(plan){const box=document.createElement('div');box.className='schedule';const title=document.createElement('h3');title.textContent=plan.title;box.appendChild(title);plan.items.forEach(item=>{const row=document.createElement('p');const time=document.createElement('b');time.textContent=item.time;row.append(time,document.createTextNode(` · ${item.title}`),document.createElement('br'),document.createTextNode(item.addr||''));box.appendChild(row)});chat.appendChild(box);chat.scrollTop=chat.scrollHeight}
    async function errorMessage(response){try{const body=await response.json();return body.detail||'요청을 처리하지 못했습니다.'}catch{return '요청을 처리하지 못했습니다.'}}
    async function send(text){const message=(text||inp.value).trim();if(!message)return;inp.value='';bubble('user',message);const loading=bubble('bot','현재 상황과 주변 정보를 확인하는 중입니다…');try{const excluded=[...lastCards,...selectedCards.values()].map(card=>card.contentid).filter(Boolean);const response=await fetch(API+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,lat:pos.lat,lng:pos.lng,exclude_ids:excluded,...tripContext()})});if(!response.ok)throw new Error(await errorMessage(response));const data=await response.json();loading.remove();bubble('bot',data.text||'추천 결과를 준비했습니다.');renderCards(data.cards)}catch(error){loading.remove();bubble('bot',`추천을 불러오지 못했어요. ${error.message}`)}}
    async function buildSchedule(){const cards=[...selectedCards.values()];if(!cards.length){bubble('bot','먼저 추천 장소를 일정에 담아주세요.');return}const loading=bubble('bot','선택한 장소로 일정을 구성하는 중입니다…');try{const response=await fetch(API+'/api/schedule',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cards})});if(!response.ok)throw new Error(await errorMessage(response));const data=await response.json();loading.remove();renderSchedule(data)}catch(error){loading.remove();bubble('bot',`일정을 만들지 못했어요. ${error.message}`)}}
    async function checkHealth(){try{const response=await fetch(API+'/health');const data=await response.json();if(!response.ok||!data.ok)throw new Error();apiStatus.textContent=data.tour_api_configured?'관광 API 연결됨':'API 키 확인 필요';apiStatus.className='status '+(data.tour_api_configured?'ok':'bad')}catch{apiStatus.textContent='서버 연결 오류';apiStatus.className='status bad'}}

    document.querySelectorAll('.chip').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.chip').forEach(item=>item.classList.remove('on'));button.classList.add('on')}));
    document.querySelectorAll('[data-message]').forEach(button=>button.addEventListener('click',()=>send(button.dataset.message)));
    document.getElementById('startTrip').addEventListener('click',()=>{const context=tripContext();send(`${context.region||'현재 위치'} 여행을 시작할게요. 주변 관광지와 기본 일정 후보를 추천해줘.`)});
    document.getElementById('buildSchedule').addEventListener('click',buildSchedule);
    document.getElementById('redesignSchedule').addEventListener('click',()=>selectedCards.size?buildSchedule():send('오늘 일정을 다시 짜줘'));
    document.getElementById('sendButton').addEventListener('click',()=>send());
    inp.addEventListener('keydown',event=>{if(event.key==='Enter')send()});
    document.getElementById('date').value=localDate();
    navigator.geolocation?.getCurrentPosition(result=>{pos={lat:result.coords.latitude,lng:result.coords.longitude}},()=>{});
    bubble('bot','안녕하세요! 여행 조건을 고르고 주변 추천을 시작해 보세요. 혼잡이나 날씨 변화가 생기면 새로운 대안을 찾아드릴게요.');
    checkHealth();
  </script>
</body>
</html>
