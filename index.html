<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RePlan — 여행 재설계 가이드</title><style>
:root{--blue:#2457d6;--navy:#12213f;--ink:#172033;--muted:#68738a;--bg:#f5f7fb;--line:#e5e9f2;--green:#168a63;--orange:#c7681c}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eef3ff,#f9fbff);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}#app{width:min(1120px,100%);margin:auto;min-height:100vh;background:#fff;box-shadow:0 12px 50px #172b4d18}header{padding:22px 28px;background:linear-gradient(120deg,var(--navy),#2457d6);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:16px}h1{margin:0;font-size:24px}header p{margin:5px 0 0;color:#dce7ff;font-size:13px}.status{padding:8px 12px;border-radius:99px;background:#ffffff1c;font-size:12px;white-space:nowrap}main{display:grid;grid-template-columns:330px 1fr;gap:20px;padding:20px;background:var(--bg)}.panel,.chatbox{background:#fff;border:1px solid var(--line);border-radius:18px}.panel{padding:18px;height:max-content}.panel h2{font-size:16px;margin:0 0 16px}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:#49556c}.field input{width:100%;padding:11px;border:1px solid #d7deeb;border-radius:10px;font-size:14px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #d7deeb;background:#fff;border-radius:99px;padding:7px 10px;color:#526078;cursor:pointer;font-size:12px}.chip.on{background:#eaf0ff;border-color:#6f91ed;color:#204ab7;font-weight:700}.primary{width:100%;border:0;border-radius:11px;padding:12px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}.notice{margin-top:12px;padding:10px 12px;background:#f3f6ff;border-radius:10px;color:#53607a;font-size:11px;line-height:1.5}.chatbox{min-height:680px;display:flex;flex-direction:column;overflow:hidden}.chathead{padding:15px 18px;border-bottom:1px solid var(--line);font-weight:800}.chathead small{display:block;color:var(--muted);font-weight:400;font-size:11px;margin-top:3px}.chat{flex:1;padding:18px;overflow:auto;background:#fbfcff}.msg{max-width:84%;padding:11px 13px;border-radius:14px;margin:8px 0;line-height:1.55;font-size:14px;white-space:pre-wrap}.bot{background:#fff;border:1px solid var(--line)}.user{margin-left:auto;background:var(--blue);color:#fff}.quick{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);overflow:auto}.quick button{white-space:nowrap;border:1px solid #cbd7f5;background:#f7f9ff;border-radius:99px;padding:8px 11px;color:#3157bb;cursor:pointer;font-size:12px}.inputbar{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}.inputbar input{flex:1;border:1px solid #d7deeb;border-radius:99px;padding:12px 15px;font-size:14px}.inputbar button{border:0;border-radius:99px;background:var(--blue);color:#fff;padding:0 18px;font-weight:700}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:10px 0 12px}.card{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#fff;box-shadow:0 3px 12px #2038640b}.card img{width:100%;height:105px;object-fit:cover;background:#e5ebf6}.cardbody{padding:10px}.cardtitle{font-weight:800;font-size:13px}.cardaddr{color:var(--muted);font-size:11px;margin-top:3px;min-height:30px}.badge{display:inline-block;margin-top:7px;border-radius:99px;padding:4px 7px;background:#e9f8f1;color:var(--green);font-size:10px;font-weight:700}.badge.high{background:#fff0e7;color:var(--orange)}.card button{margin:0 10px 10px;padding:7px 9px;border:1px solid #cad5ef;border-radius:8px;background:#fff;color:#3157bb;cursor:pointer;font-size:11px}.empty{padding:18px;background:#fff7ed;border-radius:12px;color:#875222;font-size:13px}.schedule{margin:12px 0;padding:12px;border:1px solid #dce5fb;border-radius:12px;background:#f7f9ff}.schedule h3{margin:0 0 8px;font-size:14px}.schedule p{margin:5px 0;font-size:12px}.footer{padding:12px 20px;color:#8a94a8;font-size:11px;text-align:center;border-top:1px solid var(--line)}@media(max-width:760px){main{display:block;padding:10px}.panel{margin-bottom:10px}.chatbox{min-height:690px}header{padding:18px}.status{display:none}}
</style></head><body><div id="app"><header><div><h1>RePlan 🧭</h1><p>여행 중 변수가 생기면, 지금 상황에 맞게 다시 계획해요.</p></div><div class="status" id="apiStatus">연결 확인 중</div></header><main><aside class="panel"><h2>여행 조건</h2><div class="field"><label>현재 여행 지역</label><input id="region" value="서울 종로구"></div><div class="field"><label>여행 날짜</label><input id="date" type="date"></div><div class="field"><label>여행 스타일</label><div class="chips" id="styles"><button class="chip on">문화·역사</button><button class="chip">카페·휴식</button><button class="chip">자연·산책</button><button class="chip">맛집</button></div></div><button class="primary" onclick="startTrip()">이 조건으로 여행 시작하기</button><div class="notice">회원가입 없이 이용할 수 있습니다. 추천 결과에서 ‘일정에 담기’를 누르면 간단한 일정이 만들어집니다.</div></aside><section class="chatbox"><div class="chathead">실시간 여행 상담 <small>혼잡·비·동선 변경을 말해보세요.</small></div><div class="chat" id="chat"></div><div class="quick"><button onclick="send('주변 관광지 추천해줘')">📍 주변 추천</button><button onclick="send('지금 너무 혼잡해요')">😵 혼잡해요</button><button onclick="send('비가 오기 시작했어요')">☔ 비가 와요</button><button onclick="send('오늘 일정을 다시 짜줘')">🔄 일정 재설계</button></div><div class="inputbar"><input id="inp" placeholder="예: 경복궁이 너무 붐벼요" onkeydown="if(event.key==='Enter')send()"><button onclick="send()">전송</button></div></section></main><div class="footer">한국관광공사 TourAPI와 Open-Meteo를 활용한 RePlan 프로토타입</div></div><script>
const API=(window.REPLAN_API||'').replace(/\/$/,'');let pos={lat:37.5665,lng:126.9780},lastCards=[];const chat=document.getElementById('chat'),inp=document.getElementById('inp');navigator.geolocation?.getCurrentPosition(p=>pos={lat:p.coords.latitude,lng:p.coords.longitude},()=>{});document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on')});function safe(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function bubble(who,text){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}function renderSchedule(plan){const d=document.createElement('div');d.className='schedule';d.innerHTML='<h3>'+safe(plan.title)+'</h3>'+plan.items.map(x=>`<p><b>${safe(x.time)}</b> · ${safe(x.title)}<br><span>${safe(x.addr)}</span></p>`).join('');chat.appendChild(d)}function cards(items){lastCards=items||[];const wrap=document.createElement('div');wrap.className='cards';if(!lastCards.length){wrap.innerHTML='<div class="empty">추천 결과가 없습니다. 지역이나 검색 조건을 바꿔 다시 시도해 주세요.</div>'}lastCards.forEach((c,i)=>{const x=Number(c.congestion??50),hi=x>=60;wrap.innerHTML+=`<article class="card">${c.img?`<img src="${safe(c.img)}" alt="${safe(c.title)}">`:'<div style="height:105px;background:#e8eef9"></div>'}<div class="cardbody"><div class="cardtitle">${safe(c.title||'추천 관광지')}</div><div class="cardaddr">${safe(c.addr||'주소 정보 없음')}<br>${c.dist?`약 ${Math.round(c.dist)}m`:''}</div><span class="badge ${hi?'high':''}">예상 혼잡도 ${Math.round(x)}% · ${hi?'혼잡':'비교적 여유'}</span></div><button onclick="makeSchedule(${i})">일정에 담기</button></article>`});chat.appendChild(wrap);chat.scrollTop=chat.scrollHeight}async function makeSchedule(i){const picked=lastCards.slice(i,i+4);try{const r=await fetch(API+'/api/schedule',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cards:picked})});const d=await r.json();renderSchedule(d)}catch(e){bubble('bot','일정표를 만드는 중 문제가 생겼어요. 잠시 후 다시 시도해 주세요.')}}async function send(text){const m=(text||inp.value).trim();if(!m)return;inp.value='';bubble('user',m);bubble('bot','현재 상황과 주변 정보를 확인하는 중입니다…');try{const r=await fetch(API+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m,lat:pos.lat,lng:pos.lng,exclude_ids:lastCards.map(x=>x.contentid).filter(Boolean)})});if(!r.ok)throw Error(await r.text());const d=await r.json();chat.lastChild.remove();bubble('bot',d.text||'추천 결과를 준비했습니다.');cards(d.cards)}catch(e){chat.lastChild.remove();bubble('bot','관광정보 서버와 연결하지 못했습니다. 잠시 후 다시 시도해 주세요.')}}function startTrip(){const r=document.getElementById('region').value,d=document.getElementById('date').value;send(`${r} 여행을 시작할게요. ${d?'여행일은 '+d+'입니다. ':''}주변 관광지와 기본 일정을 추천해줘.`)}document.getElementById('date').value=new Date().toISOString().slice(0,10);document.getElementById('apiStatus').textContent='API 연결 준비 완료';bubble('bot','안녕하세요! 주변 추천부터 혼잡 우회, 날씨 대응, 간단한 일정 만들기까지 도와드릴게요.');
</script></body></html>
